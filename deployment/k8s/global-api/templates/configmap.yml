apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "global-api.fullname" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "Tgs": "{{ .Values.connectionStrings.tgs }}",
        "Nats": "{{ .Values.connectionStrings.nats }}"
      },
      "Global": {
        "BrandCertificateBaseUrl": "http://brand-cert-api"
      }
    }
